[project]
name = "rootline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "langgraph>=0.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pypdf>=5.0",
    "pytest>=8.3",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "types-reportlab>=4.2",
]
agent-server = [
    "langgraph-cli[inmem]>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootline"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
