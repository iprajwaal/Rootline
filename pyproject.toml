[project]
name = "rootline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "detect-secrets>=1.5",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "langchain>=1.0",
    "langchain-google-genai>=2.1",
    "langfuse>=5.0",
    "langgraph>=0.6",
    "markdown-it-py>=3.0",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "langgraph-cli[inmem]>=0.4",
    "mypy>=1.11",
    "pypdf>=5.0",
    "pytest>=8.3",
    "reportlab>=4.2",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "types-reportlab>=4.2",
]
agent-server = [
    "aegra-cli>=0.10.8",
]

[project.scripts]
rootline = "rootline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootline"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# scikit-learn and scipy ship without type hints.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
