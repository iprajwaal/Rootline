apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  namespace: shop
data:
  DATABASE_URL: postgresql://shop:shop@orders-db:5432/orders
  REDIS_URL: redis://cache:6379
  KAFKA_BROKERS: order-queue:9092
  PAYMENT_GATEWAY_URL: https://pay.shop.internal/v2
  DB_POOL_MAX: "20"
