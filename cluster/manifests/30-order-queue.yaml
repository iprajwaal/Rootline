apiVersion: v1
kind: Service
metadata:
  name: order-queue
  namespace: shop
spec:
  selector: {app: order-queue}
  ports: [{port: 9092}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-queue
  namespace: shop
spec:
  serviceName: order-queue
  replicas: 1
  selector: {matchLabels: {app: order-queue}}
  template:
    metadata: {labels: {app: order-queue}}
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=512M
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://order-queue:9092
          ports: [{containerPort: 9092}]
          readinessProbe:
            exec: {command: [rpk, cluster, health, --exit-when-healthy]}
            periodSeconds: 10
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 1Gi}}
