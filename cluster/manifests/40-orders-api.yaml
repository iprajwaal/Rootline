apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: shop
spec:
  type: NodePort
  selector: {app: orders-api}
  ports: [{port: 80, targetPort: 8080, nodePort: 30080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: shop
spec:
  replicas: 1
  # One replica, replaced in place: a revision that crashes takes checkout down, as it
  # would for a small service.
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 0, maxUnavailable: 1}}
  selector: {matchLabels: {app: orders-api}}
  template:
    metadata: {labels: {app: orders-api}}
    spec:
      containers:
        - name: orders-api
          image: shop-orders:dev
          imagePullPolicy: Never
          envFrom: [{configMapRef: {name: orders-config}}]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts: [{name: receipts, mountPath: /var/lib/shoplite}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
      volumes:
        # Memory-backed with a size limit: when receipts fill it, writes fail with
        # "No space left on device", as a full disk does.
        - name: receipts
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
