meta:
  doc_id: SOP-WORKER-001
  doc_type: sop
  title: Recover orders-worker from out of memory kills
  services: [orders-worker]
  owner: Orders team
  revision: 1
  effective_date: "2026-07-02"
  supersedes: null
  related: [RCA-2026-019]

record:
  purpose: Stop orders-worker from being killed for memory and get orders flowing again.
  when_to_use: >-
    Use this when the OrdersWorkerOOMKilled alert fires, or worker pods show
    "orders-worker container killed: OOMKilled (exit code 137)".
  alerts: [OrdersWorkerOOMKilled]
  prerequisites:
    - kubectl access to the shop namespace.
  steps:
    - ordinal: 1
      instruction: Check worker memory.
      command: kubectl -n shop top pod -l app=orders-worker
      check_name: memory_usage
      expect: One or more workers close to the 512Mi limit.
    - ordinal: 2
      instruction: Check how often the workers restart.
      command: kubectl -n shop get pods -l app=orders-worker
      expect: RESTARTS above 2 in the last hour.
    - ordinal: 3
      instruction: Restart the workers.
      command: kubectl -n shop rollout restart deploy/orders-worker
      action: restart_worker
      expect: Pods restart and memory drops.
    - ordinal: 4
      instruction: If restarts continue, roll back the worker release.
      command: kubectl -n shop rollout undo deploy/orders-worker
      expect: The previous worker version is running.
  verification:
    - No worker restarts for 30 minutes.
  escalation:
    - Page the orders team if workers still restart after step 4.
