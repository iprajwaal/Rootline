  - file: inc-2026-05-02-payments-401.json
    transform: slack_export
    sources: [RCA-2026-015]

  # Worker OOM. Exists only as brownfield, mostly as one page that mixes the RCA and the SOP.
  - file: orders-worker-oom-runbook.html
    transform: wiki_html
    sources: [RCA-2026-019, SOP-WORKER-001]
    title: orders-worker OOM runbook
  - file: orders-worker-oom-runbook (1).html
    transform: wiki_html
    sources: [RCA-2026-019, SOP-WORKER-001]
    title: orders-worker OOM runbook
  - file: worker-oom-quick-fix.txt
