render_as: pdf

meta:
  doc_id: SOP-QUEUE-001
  doc_type: sop
  title: Fix consumer lag on the orders queue
  services: [orders-worker, order-queue]
  owner: Orders team
  revision: 1
  effective_date: "2024-11-02"
  supersedes: null
  related: []

record:
  purpose: Clear a growing backlog on the orders topic so orders are processed again.
  scope: Applies to orders-worker in the shop-prod cluster.
  when_to_use: >-
    Use this procedure when the OrderQueueConsumerLagHigh alert fires, or when orders stay in
    pending for more than a few minutes.
  alerts: [OrderQueueConsumerLagHigh]
  definitions:
    - term: Consumer lag
      meaning: The number of messages on the orders topic that the orders-worker group has not processed yet.
  roles:
    - role: On-call engineer
      responsibility: Runs the procedure.
  prerequisites:
    - kubectl access to the shop namespace.
  overview: Check the lag, restart the workers, then check the lag again.
  steps:
    - ordinal: 1
      instruction: Check the consumer lag.
      command: kafka-consumer-groups --bootstrap-server order-queue:9092 --describe --group orders-worker
      check_name: queue_lag
      expect: Lag above 10000 on one or more partitions.
      responsibility: On-call engineer
    - ordinal: 2
      instruction: Restart the workers.
      command: kubectl -n shop rollout restart deploy/orders-worker
      action: restart_worker
      expect: All worker pods restart and rejoin the consumer group.
      responsibility: On-call engineer
    - ordinal: 3
      instruction: Check the lag again after five minutes.
      command: kafka-consumer-groups --bootstrap-server order-queue:9092 --describe --group orders-worker
      check_name: queue_lag
      expect: The lag is going down.
      responsibility: On-call engineer
  verification:
    - Lag is under 1000 on every partition.
  escalation:
    - Page the orders team if the lag keeps growing after the restart.
  review_cycle: Reviewed every year.
  records: Note the restart in the incident ticket.
  revision_history:
    - revision: 1
      date: "2024-11-02"
      author: Luis Romero
      change: First version.
