x-app: &app
  build: .
  image: rootline-app:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://rootline:rootline@postgres:5432/rootline
  # The catalog, the committed LLM cache and the embedding model come from the repo, so the
  # agent and the API read the same files as the tests.
  volumes:
    - ./corpus:/app/corpus:ro
    - ./cache:/app/cache
    - ./data/models:/app/data/models

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rootline
      POSTGRES_PASSWORD: rootline
      POSTGRES_DB: rootline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootline"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: python -m rootline.db.migrate
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: uvicorn rootline.api.app:app --host 0.0.0.0 --port 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  agent:
    <<: *app
    command: langgraph dev --host 0.0.0.0 --port 2024 --no-browser --no-reload
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "2024:2024"

  ui:
    build: ui
    depends_on:
      - agent
    ports:
      - "3000:3000"

volumes:
  pgdata:
