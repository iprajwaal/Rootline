x-app: &app
  build: .
  image: rootline-app:dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://rootline:rootline@postgres:5432/rootline
  # The catalog and the committed LLM and embedding caches come from the repo, so the agent
  # and the API read the same files as the tests. Raw uploads are kept by hash.
  volumes:
    - ./corpus:/app/corpus:ro
    - ./cache:/app/cache
    - raw:/app/data/raw

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rootline
      POSTGRES_PASSWORD: rootline
      POSTGRES_DB: rootline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootline"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: python -m rootline.db.migrate
    depends_on:
      postgres:
        condition: service_healthy

  # Ingests the corpus once. A second run finds every file unchanged and does nothing.
  seed:
    <<: *app
    command: rootline ingest corpus/greenfield corpus/brownfield corpus/reference corpus/hard
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    command: uvicorn rootline.api.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://rootline:rootline@postgres:5432/rootline
      AGENT_URL: http://agent:2024
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  # Aegra serves the LangGraph API with threads and checkpoints in Postgres, so chat memory
  # survives a restart.
  agent:
    <<: *app
    command: aegra serve --host 0.0.0.0 --port 2024
    environment:
      DATABASE_URL: postgresql://rootline:rootline@postgres:5432/rootline
      SHOPLITE_URL: http://shoplite:8080
      # Checks and fixes go to the kind cluster from `make cluster`. SHOP_MODE=shoplite uses the
      # simulated shop instead, which the scenario runner needs.
      SHOP_MODE: ${SHOP_MODE:-k8s}
      KUBE_HEALTH_URL: http://host.docker.internal:30080/health
      KUBECONFIG: /app/cluster/.kube/config
      KUBE_CONTEXT: reader
      KUBE_FIX_CONTEXT: fixer
    volumes:
      - ./corpus:/app/corpus:ro
      - ./cache:/app/cache
      - raw:/app/data/raw
      # Written by make cluster for the rootline account; not committed.
      - ./cluster/.kube:/app/cluster/.kube:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "2024:2024"

  # The system the SOP steps act on. It breaks on request and posts alerts to the API.
  shoplite:
    build: sandbox/shoplite
    profiles: [demo]
    environment:
      SHOPLITE_CATALOG: /app/catalog.yaml
      SHOPLITE_ALERT_WEBHOOK: http://api:8000/incidents
    volumes:
      - ./corpus/catalog.yaml:/app/catalog.yaml:ro
    ports:
      - "8080:8080"

  ui:
    build: ui
    depends_on:
      - agent
    ports:
      - "3000:3000"

volumes:
  pgdata:
  raw:
